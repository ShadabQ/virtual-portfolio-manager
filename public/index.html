<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Portfolio Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Paper trading</p>
          <h1>Virtual Portfolio Manager</h1>
        </div>
        <button id="refreshBtn" class="primary-btn">Refresh live prices</button>
      </header>

      <main class="layout">
        <section class="summary-grid" id="summaryGrid"></section>

        <section class="panel forms-panel">
          <div class="form-card">
            <h2>Add stock</h2>
            <form id="buyForm">
              <div class="field-group">
                <label for="buySymbol">Stock</label>
                <select id="buySymbol" name="symbol" required>
                  <option value="">Select stock</option>
                </select>
              </div>

              <div class="field-row">
                <div class="field-group">
                  <label for="buyQty">Quantity</label>
                  <input id="buyQty" name="qty" type="number" min="1" step="1" required />
                </div>
                <div class="field-group">
                  <label for="buyPrice">Buy price</label>
                  <input id="buyPrice" name="buyPrice" type="number" min="0.01" step="0.01" required />
                </div>
              </div>

              <button type="submit" class="primary-btn">Add to portfolio</button>
            </form>
          </div>

          <div class="form-card">
            <h2>Sell stock</h2>
            <form id="sellForm">
              <div class="field-group">
                <label for="sellSymbol">Stock</label>
                <select id="sellSymbol" name="symbol" required>
                  <option value="">Select stock</option>
                </select>
              </div>

              <div class="field-row">
                <div class="field-group">
                  <label for="sellQty">Quantity</label>
                  <input id="sellQty" name="qty" type="number" min="1" step="1" required />
                </div>
                <div class="field-group">
                  <label for="sellPrice">Sell price</label>
                  <input id="sellPrice" name="sellPrice" type="number" min="0.01" step="0.01" required />
                </div>
              </div>

              <button type="submit" class="secondary-btn">Sell position</button>
            </form>
          </div>
        </section>

        <section class="panel">
          <h2>Portfolio positions</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Symbol</th>
                  <th>Company</th>
                  <th>Qty</th>
                  <th>Avg Buy</th>
                  <th>LTP</th>
                  <th>Invested</th>
                  <th>Market Value</th>
                  <th>P&L</th>
                </tr>
              </thead>
              <tbody id="portfolioTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
